application:
  name: quickcart-delivery-ml
  env: dev

logging:
  level: INFO
  format: json

model:
  bucket: quickcart-models-dev
  key: models/delivery/latest/model.joblib

rule_engine:
  enabled: true
  distance_bands:
    - max: 249
      days: 1
    - max: 749
      days: 2
    - max: 1499
      days: 3
    - max: 2249
      days: 4
  default_transit_days: 5
  severe_weather_threshold: 7
  severe_weather_extra_days: 1
  holiday_extra_days: 1
  carrier_adjustments:
    CARRIER_A: -1
    CARRIER_B: 0
    CARRIER_C: 0
    CARRIER_D: 1
    CARRIER_E: 1
  min_estimate_days: 1

inference:
  primary_source: ML
  model_name: delivery_regressor
  model_version: "1.0.0"
  require_model: true

shadow:
  enabled: false

metrics:
  enabled: true
  port: 9090

cloud:
  region: us-west-2
  provider: aws