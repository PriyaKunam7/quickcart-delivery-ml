application:
  name: quickcart-delivery-ml
  env: prod

logging:
  level: INFO
  format: json

model:
  bucket: quickcart-models-prod
  key: models/delivery/latest/model.joblib

rule_engine:
  enabled: true
  default_estimate_days: 3

shadow:
  enabled: false

metrics:
  enabled: true
  port: 9090

cloud:
  region: us-west-2
  provider: aws