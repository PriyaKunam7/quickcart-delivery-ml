application:
  name: opsassist
  env: dev

llm:
  # Provider-agnostic: only the *name* of the backend is configured here.
  # Actual credentials are never stored in this file -- see .env.example.
  provider: openai   # one of: openai, azure, aws
  model: gpt-4o-mini # placeholder default; swappable per provider
  timeout_seconds: 30
  max_retries: 2

retrieval:
  vector_store: faiss
  embedding_dimension: 512
  top_k: 5
  score_threshold: 0.15

guardrails:
  enabled: true
  max_response_tokens: 1024
  block_on_missing_citation: true

observability:
  tracing_enabled: true
  log_level: INFO

evaluation:
  dataset_version: v1
  min_hit_at_k: 0.90
  min_groundedness: 0.90